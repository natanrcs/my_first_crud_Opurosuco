<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="update.css" />
  </head>
  <body>
    <form id="form" onsubmit="updateProduct(event)">
      <h1>Atualizar Produto</h1>
      <input
        type="number"
        id="productId"
        placeholder="ID do produto"
        required
      />
      <input
        type="text"
        id="name"
        placeholder="Novo nome do produto"
        required
      />
      <input type="number" id="price" placeholder="Novo preço" required />
      <input type="number" id="stock" placeholder="Novo estoque" required />
      <button type="submit">Atualizar</button>
    </form>

    <footer>&copy; Criado por Natanrcs</footer>

    <script src="update.js"></script>
  </body>
</html>
