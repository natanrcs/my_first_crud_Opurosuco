<body>
    <form onsubmit="createProduct(event)">
        <h1>Create Product</h1>
        <input type="text" id="name" placeholder="Nome do Produto" required>
        <input type="text" id="price" placeholder="Preco" required>
        <input type="text" id="stock" placeholder="Quantidade" required>
        <button type="submit" id="btn">Criar</button>
    </form>
